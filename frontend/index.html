<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="description" content="ArthSathi - Your Financial Guide">
    <title>ArthSathi | अर्थसाथी</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/character.css">
</head>
<body>

<div class="screen" id="screen-character">

    <!-- App Logo -->
    <div class="app-header">
        <div class="app-logo">Arth<span>Sathi</span></div>
        <div class="app-tagline">आपका वित्तीय मार्गदर्शक</div>
    </div>

    <!-- Speech bubble -->
    <div class="speech-bubble" id="welcome-text">
        अपना मार्गदर्शक चुनें
        <button class="speak-btn" onclick="speakText()" title="सुनें">🔊</button>
    </div>

    <!-- Character selection cards -->
    <div class="character-row">

        <!-- Male character — Arth -->
        <div class="character-card" id="card-arth" onclick="selectCharacter('arth')">

            <!-- Animated arrow pointing DOWN to this card -->
            <div class="arrow-hint" id="arrow-arth"
                 style="top:-36px; left:50%; transform:translateX(-50%);">
                ↓
            </div>

            <!-- CSS 2D Character — Male -->
            <div class="character-figure arth" id="figure-arth">
                <div class="char-hair-male"></div>
                <div class="char-head">
                    <div class="char-eyes">
                        <div class="char-eye"></div>
                        <div class="char-eye"></div>
                    </div>
                    <div class="char-mouth"></div>
                </div>
                <div class="char-neck"></div>
                <div class="char-body char-body-male"></div>
                <div class="char-arm char-arm-left arth"></div>
                <div class="char-arm char-arm-right arth"></div>
                <div class="char-leg char-leg-left arth"></div>
                <div class="char-leg char-leg-right arth"></div>
                <div class="char-shoe char-shoe-left"></div>
                <div class="char-shoe char-shoe-right"></div>
            </div>

            <div class="char-name">अर्थ</div>
            <div class="char-role">आपका साथी</div>
        </div>

        <!-- Female character — Sathi -->
        <div class="character-card" id="card-sathi" onclick="selectCharacter('sathi')">

            <!-- Animated arrow pointing DOWN to this card -->
            <div class="arrow-hint" id="arrow-sathi"
                 style="top:-36px; left:50%; transform:translateX(-50%);">
                ↓
            </div>

            <!-- CSS 2D Character — Female -->
            <div class="character-figure sathi" id="figure-sathi">
                <div class="char-hair-female"></div>
                <div class="char-head">
                    <div class="char-eyes">
                        <div class="char-eye"></div>
                        <div class="char-eye"></div>
                    </div>
                    <div class="char-mouth"></div>
                </div>
                <div class="char-neck"></div>
                <div class="char-body char-body-female"></div>
                <div class="char-arm char-arm-left sathi"></div>
                <div class="char-arm char-arm-right sathi"></div>
                <div class="char-leg char-leg-left sathi"></div>
                <div class="char-leg char-leg-right sathi"></div>
            </div>

            <div class="char-name">साथी</div>
            <div class="char-role">आपकी सहेली</div>
        </div>

    </div>

    <!-- Continue button — hidden until character is selected -->
    <button class="btn-primary pulse" id="btn-continue"
            style="display:none; margin-top:10px;"
            onclick="goToLanguageScreen()">
        आगे बढ़ें →
    </button>

    <!-- Progress dots — step 1 of 7 -->
    <div class="progress-dots">
        <div class="dot active"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
        <div class="dot"></div>
    </div>

</div>

<script src="js/speech.js"></script>
<script src="js/app.js"></script>
<script>
    // Speak welcome message when page loads
    window.addEventListener('load', function() {
        setTimeout(function() {
            speak("अपना मार्गदर्शक चुनें। अर्थ या साथी?", 'hi-IN');
        }, 600);
    });

    // Fallback: speak on first touch if browser blocked auto-play
    var hasSpoken = false;
    document.addEventListener('click', function() {
        if (!hasSpoken) {
            hasSpoken = true;
            speak("अपना मार्गदर्शक चुनें। अर्थ या साथी?", 'hi-IN');
        }
    }, { once: true });

    function speakText() {
        speak("अपना मार्गदर्शक चुनें। अर्थ या साथी?", 'hi-IN');
    }

    function selectCharacter(name) {
        // Save choice
        localStorage.setItem('character', name);

        // Highlight selected card
        document.getElementById('card-arth').classList.remove('selected');
        document.getElementById('card-sathi').classList.remove('selected');
        document.getElementById('card-' + name).classList.add('selected');

        // Add nodding animation to selected character
        var fig = document.getElementById('figure-' + name);
        fig.classList.add('nodding');
        setTimeout(function() { fig.classList.remove('nodding'); }, 2000);

        // Hide arrows
        document.getElementById('arrow-arth').style.display = 'none';
        document.getElementById('arrow-sathi').style.display = 'none';

        // Show continue button
        document.getElementById('btn-continue').style.display = 'inline-block';

        // Speak confirmation
        if (name === 'arth') {
            speak("अर्थ को चुना गया। आगे बढ़ने के लिए बटन दबाएं।", 'hi-IN');
        } else {
            speak("साथी को चुना गया। आगे बढ़ने के लिए बटन दबाएं।", 'hi-IN');
        }
    }

    function goToLanguageScreen() {
        window.location.href = 'language.html';
    }
</script>

</body>
</html>
